<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1584 396"
     width="1584" height="396"
     role="img"
     aria-label="EasyDemo — LinkedIn company banner">
  <title>EasyDemo</title>
  <desc>EasyDemo LinkedIn profile banner for company page.</desc>

  <defs>
    <linearGradient id="li-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B6CB0"/>
      <stop offset="65%" stop-color="#234E80"/>
      <stop offset="100%" stop-color="#0F2A4A"/>
    </linearGradient>
    <radialGradient id="li-glow" cx="22%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38B2AC" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#38B2AC" stop-opacity="0"/>
    </radialGradient>
    <symbol id="li-play" viewBox="0 0 100 100" overflow="visible">
      <path d="M22 12 L84 50 L22 88 Z"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="6"
            stroke-linejoin="round"
            stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1584" height="396" fill="url(#li-bg)"/>
  <rect width="1584" height="396" fill="url(#li-glow)"/>

  <!-- Right-side brand stripe (accent) -->
  <rect x="1484" y="0" width="100" height="396" fill="#38B2AC"/>
  <rect x="1484" y="0" width="100" height="396" fill="#FFFFFF" opacity="0.08"/>

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="99" x2="1484" y2="99"/>
    <line x1="0" y1="198" x2="1484" y2="198"/>
    <line x1="0" y1="297" x2="1484" y2="297"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(120 130)">
    <g color="#FFFFFF" transform="scale(0.5)">
      <use href="#li-play" width="100" height="100"/>
    </g>
    <text x="68" y="42"
          font-family="'Sora', 'Inter', system-ui, sans-serif"
          font-weight="800"
          font-size="58"
          fill="#FFFFFF">
      Demo<tspan fill="#38B2AC">BR</tspan>
    </text>
  </g>

  <!-- Subtitle / tagline -->
  <g transform="translate(120 225)">
    <text font-family="'Sora', 'Inter', system-ui, sans-serif"
          font-size="32"
          font-weight="700"
          fill="#FFFFFF">
      Demos interativas em PT-BR, com PIX e LGPD.
    </text>
  </g>

  <!-- Small URL / hashtag -->
  <g transform="translate(120 305)">
    <text font-family="'Inter', system-ui, sans-serif"
          font-size="20"
          font-weight="600"
          fill="#FFFFFF"
          fill-opacity="0.85">
      easydemo.io
      <tspan fill="#38B2AC" dx="20">#SaaSBR #Demos #LGPD</tspan>
    </text>
  </g>

  <!-- Optional decorative repeated symbol -->
  <g color="#FFFFFF" opacity="0.05" transform="translate(1050 60) scale(2.4)">
    <use href="#li-play" width="100" height="100"/>
  </g>
</svg>
