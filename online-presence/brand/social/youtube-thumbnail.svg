<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 720"
     width="1280" height="720"
     role="img"
     aria-label="DemoBR — YouTube thumbnail template">
  <title>DemoBR — YouTube thumbnail template</title>
  <desc>Reusable YouTube thumbnail template. Title text centralizado reservado para edição.</desc>

  <defs>
    <linearGradient id="yt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B6CB0"/>
      <stop offset="55%" stop-color="#1E4E80"/>
      <stop offset="100%" stop-color="#0F2A4A"/>
    </linearGradient>
    <radialGradient id="yt-glow" cx="78%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38B2AC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38B2AC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yt-warm" cx="18%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#ED8936" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ED8936" stop-opacity="0"/>
    </radialGradient>
    <symbol id="yt-play" viewBox="0 0 100 100" overflow="visible">
      <path d="M22 12 L84 50 L22 88 Z"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="6"
            stroke-linejoin="round"
            stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1280" height="720" fill="url(#yt-bg)"/>
  <rect width="1280" height="720" fill="url(#yt-glow)"/>
  <rect width="1280" height="720" fill="url(#yt-warm)"/>

  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- Wordmark header (top-left) -->
  <g transform="translate(80 80)">
    <g color="#FFFFFF" transform="scale(0.5)">
      <use href="#yt-play" width="100" height="100"/>
    </g>
    <text x="68" y="42"
          font-family="'Sora', 'Inter', system-ui, sans-serif"
          font-weight="800"
          font-size="58"
          fill="#FFFFFF">
      Demo<tspan fill="#38B2AC">BR</tspan>
    </text>
  </g>

  <!-- Top-right LGPD tag -->
  <g transform="translate(1010 95)">
    <rect width="190" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.30"/>
    <text x="16" y="23"
          font-family="'Inter', system-ui, sans-serif"
          font-size="14"
          font-weight="600"
          fill="#FFFFFF"
          letter-spacing="0.06em">
      LGPD · PT-BR · PIX
    </text>
  </g>

  <!-- Title placeholder centered (editable in editor) -->
  <g transform="translate(640 380)" text-anchor="middle">
    <text font-family="'Sora', 'Inter', system-ui, sans-serif"
          font-weight="800"
          font-size="80"
          fill="#FFFFFF">
      <tspan x="0" dy="0">{TITULO_DO_VIDEO}</tspan>
      <tspan x="0" dy="92" font-size="36" font-weight="600" fill="#38B2AC">Subtítulo opcional</tspan>
    </text>
  </g>

  <!-- Footer: URL -->
  <g transform="translate(80 645)">
    <text font-family="'Inter', system-ui, sans-serif"
          font-size="22"
          font-weight="600"
          fill="#FFFFFF"
          fill-opacity="0.85">
      easydemo.io
      <tspan fill="#38B2AC" dx="14">#demosinterativas</tspan>
    </text>
  </g>
</svg>
