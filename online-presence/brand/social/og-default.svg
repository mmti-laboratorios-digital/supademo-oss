<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 630"
     width="1200" height="630"
     role="img"
     aria-label="DemoBR — Open Graph default card">
  <title>DemoBR</title>
  <desc>Demos interativas pra vender mais, sem uma reunião a mais.</desc>

  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B6CB0"/>
      <stop offset="55%" stop-color="#1E4E80"/>
      <stop offset="100%" stop-color="#0F2A4A"/>
    </linearGradient>

    <radialGradient id="og-glow" cx="78%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#38B2AC" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#38B2AC" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38B2AC" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="og-warm" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#ED8936" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ED8936" stop-opacity="0"/>
    </radialGradient>

    <!-- Reusable play triangle (white, scaled for hero) -->
    <symbol id="og-play" viewBox="0 0 100 100" overflow="visible">
      <path d="M22 12 L84 50 L22 88 Z"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="6"
            stroke-linejoin="round"
            stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>
  <rect width="1200" height="630" fill="url(#og-warm)"/>

  <!-- Grid texture (subtle, evokes product UI) -->
  <g opacity="0.10" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Decorative large triangle (right side, low opacity) -->
  <g color="#FFFFFF" opacity="0.06" transform="translate(820 80) scale(2.6)">
    <use href="#og-play" width="100" height="100"/>
  </g>

  <!-- LGPD + PT-BR pill -->
  <g transform="translate(80 80)">
    <rect x="0" y="0" width="270" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="0" y="0" width="270" height="40" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.30"/>
    <circle cx="22" cy="20" r="5" fill="#38B2AC"/>
    <text x="40" y="26"
          font-family="'Inter', system-ui, sans-serif"
          font-size="15"
          font-weight="600"
          fill="#FFFFFF"
          letter-spacing="0.06em">
      BETA PUBLICO · PT-BR · LGPD
    </text>
  </g>

  <!-- Wordmark: play symbol + DemoBR -->
  <g transform="translate(80 175)">
    <g color="#FFFFFF" transform="scale(0.8)">
      <use href="#og-play" width="100" height="100"/>
    </g>

    <text x="100" y="64"
          font-family="'Sora', 'Inter', system-ui, sans-serif"
          font-weight="800"
          font-size="84"
          fill="#FFFFFF">
      Demo<tspan fill="#38B2AC">BR</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(80 295)">
    <text font-family="'Sora', 'Inter', system-ui, sans-serif"
          font-weight="700"
          font-size="56"
          fill="#FFFFFF">
      <tspan x="0" dy="0">Demos interativas pra</tspan>
      <tspan x="0" dy="66">vender mais, sem uma</tspan>
      <tspan x="0" dy="66">reunião a mais.</tspan>
    </text>
  </g>

  <!-- Sub-tagline + URL -->
  <g transform="translate(80 545)">
    <text font-family="'Inter', system-ui, sans-serif"
          font-size="22"
          font-weight="500"
          fill="#FFFFFF"
          fill-opacity="0.85">
      <tspan x="0" dy="0">Captura em 1 clique · Player PT-BR-first · PIX + boleto + NF-e</tspan>
      <tspan x="0" dy="34" font-weight="700" fill-opacity="1" fill="#38B2AC">easydemo.io</tspan>
    </text>
  </g>

  <!-- Footer brand stripe -->
  <rect x="0" y="610" width="1200" height="20" fill="#38B2AC"/>
</svg>
