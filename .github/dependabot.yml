# =============================================================================
# DemoBR — Dependabot
# Updates para pnpm, github-actions, docker
# =============================================================================
version: 2
updates:
  # ---------------------------------------------------------------------------
  # pnpm packages
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      pnpm-minor:
        patterns:
          - "@*/*"
          - "*"
        update-types:
          - "minor"
          - "patch"
      pnpm-major:
        patterns:
          - "@*/*"
          - "*"
        update-types:
          - "major"
    ignore:
      # Não tocar em deps fixadas por pin exato na RFC
      - dependency-name: "next"
        versions: ["16.x"]
      - dependency-name: "react"
        versions: ["20.x"]
      - dependency-name: "drizzle-orm"
        versions: ["1.x"]

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Docker base images (Dockerfile*)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Pinados por motivo de compatibilidade
      - dependency-name: "node"
        versions: ["23.x", "24.x"]
      - dependency-name: "postgres"
        versions: ["17.x"]