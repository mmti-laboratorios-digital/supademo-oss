# pgBackRest — backup cifrado para R2 (S3-compatible)
# Documentação: https://pgbackrest.org/configuration.html

[global]
repo1-type=s3
repo1-s3-bucket=demo-private
repo1-s3-endpoint=${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
repo1-s3-key=${R2_ACCESS_KEY_ID}
repo1-s3-key-secret=${R2_SECRET_ACCESS_KEY}
repo1-s3-region=auto
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${BACKUP_CIPHER_PASS}
repo1-retention-full=2
repo1-retention-diff=7
repo1-retention-archive=12

[main]
pg1-path=/var/lib/postgresql/data
pg1-user=app_owner

# Cron sugerido (em /etc/cron.d/pgbackrest):
# 0 3 * * * postgres pgbackrest backup --type=full
# 0 3 * * 0 postgres pgbackrest backup --type=full
# 30 3 * * 1-6 postgres pgbackrest backup --type=delta