# PostgreSQL 16 — single-node VPS 8 GB.
# Custom config montado em /etc/postgresql/postgresql.conf.

# ─────────── Connection ───────────
listen_addresses = '*'
# Porta interna do container Postgres (5432). O mapeamento host:container
# em infra/docker-compose.yml publica este serviço em 55432 no host —
# evitando colisão com o `postgresql@16-main` do SO. Se rodar este
# postgresql.conf fora de Docker, lembre-se de ajustar o client.
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ─────────── Memory ───────────
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# ─────────── WAL & Checkpoints ───────────
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# ─────────── Planner ───────────
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# ─────────── Parallelism ───────────
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ─────────── Autovacuum (importante para DSR/cleanup) ───────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 20ms

# ─────────── Logging ───────────
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql.log'
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# ─────────── Locale ───────────
lc_messages = 'pt_BR.UTF-8'
lc_monetary = 'pt_BR.UTF-8'
lc_numeric = 'pt_BR.UTF-8'
lc_time = 'pt_BR.UTF-8'

# ─────────── Replication-ready ───────────
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
hot_standby = on