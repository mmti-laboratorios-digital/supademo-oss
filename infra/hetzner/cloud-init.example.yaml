#cloud-config
# =============================================================================
#  cloud-init de referência — VPS DemoBR (Hetzner Cloud)
#
#  Este arquivo é um ARTEFATO DE REFERÊNCIA (NÃO aplicar diretamente).
#  O arquivo autoritativo é gerado por scripts/provision-hetzner.sh em
#  infra/cloud-init.yaml, com a SSH public key do operador já embutida.
#
#  Stack: Docker + UFW + fail2ban + Caddy (DNS-01 Cloudflare)
#  Imagem: ubuntu-24.04 (cloud image oficial Hetzner)
#  Localização padrão: fsn1 (Falkenstein, DE)
#  Tipo padrão do script: cx22 (cost-optimized, 1 vCPU / 4 GB / 40 GB SSD)
#  Tipo sugerido produção: cpx32 (4 vCPU / 8 GB / 160 GB SSD, ~€35/mês)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Pacotes base instalados via cloud-init (apt)
#    Nota: o SSH key do operador é injetado pela Hetzner via flag
#    `--ssh-key` no `hcloud server create`, antes do cloud-init rodar.
# -----------------------------------------------------------------------------
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - ufw
  - fail2ban
  - unattended-upgrades

# -----------------------------------------------------------------------------
# 2. Arquivos estáticos (Caddyfile + jail.local do fail2ban)
# -----------------------------------------------------------------------------
write_files:
  # --- Caddyfile: reverse proxy + TLS via DNS-01 Cloudflare ---
  - path: /etc/caddy/Caddyfile
    owner: root:root
    permissions: "0644"
    content: |
      cdn.${CN_DOMAIN} {
        tls {
          dns cloudflare {env.CLOUDFLARE_API_TOKEN}
        }
        @static path /_static/*
        header Cache-Control "public, max-age=31536000, immutable"
        reverse_proxy app:3000
      }

      app.${CN_DOMAIN} {
        tls {
          dns cloudflare {env.CLOUDFLARE_API_TOKEN}
        }
        reverse_proxy app:3000
      }

  # --- fail2ban: jail sshd mais agressivo que o default ---
  - path: /etc/fail2ban/jail.local
    owner: root:root
    permissions: "0644"
    content: |
      [sshd]
      enabled  = true
      port     = ssh
      filter   = sshd
      logpath  = /var/log/auth.log
      maxretry = 4
      bantime  = 1h
      findtime = 10m

# -----------------------------------------------------------------------------
# 3. Comandos de bootstrap (executados em ordem no primeiro boot)
# -----------------------------------------------------------------------------
runcmd:
  # ---- UFW (stateful firewall: deny default, allow apenas 22/80/443) ----
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment "ssh"
  - ufw allow 80/tcp comment "http (caddy)"
  - ufw allow 443/tcp comment "https (caddy)"
  - ufw --force enable

  # ---- Docker CE (repo oficial, não o pacote distro "docker.io") ----
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # ---- Caddy + plugin dns-cloudflare (para ACME DNS-01 challenge) ----
  - apt-get install -y debian-keyring debian-archive-keyring apt-transport-https
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/xcaddy/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-xcaddy-archive-keyring.gpg
  - echo "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/repos/caddy/stable/any-version/deb debian main" > /etc/apt/sources.list.d/caddy.list
  - echo "deb [signed-by=/usr/share/keyrings/caddy-xcaddy-archive-keyring.gpg] https://dl.cloudsmith.io/repos/caddy/xcaddy/any-version/deb debian main" >> /etc/apt/sources.list.d/caddy.list
  - apt-get update
  - apt-get install -y caddy
  - apt-get install -y caddy-addon-cloudflare
  - systemctl enable caddy

  # ---- fail2ban: habilita e reinicia para pegar jail.local ----
  - systemctl enable fail2ban
  - systemctl restart fail2ban

  # ---- unattended-upgrades: reconfigure non-interactive ----
  - dpkg-reconfigure -plow unattended-upgrades

  # ---- Prepara diretório de deploy ----
  - mkdir -p /opt/demobr
  # Backup da chave pública SSH (auditável depois de criado)
  - echo "${SSH_PUBKEY}" > /root/.ssh/authorized_keys_via_cloudinit
  - chmod 600 /root/.ssh/authorized_keys_via_cloudinit

final_message: "DemoBR VPS pronto em $HOSTNAME após $UPTIME segundos."

# =============================================================================
#  PLACEHOLDERS A SUBSTITUIR antes de aplicar (quando gerar fora do script):
#    ${CN_DOMAIN}        → ex.: demo.seudominio.com.br
#    ${SSH_PUBKEY}       → conteúdo de `cat ~/.ssh/id_ed25519.pub`
#
#  Para aplicar:
#    hcloud server create \
#      --name demobr-prod-01 \
#      --type cx22 \
#      --image ubuntu-24.04 \
#      --location fsn1 \
#      --ssh-key id_ed25519 \
#      --user-data-from-file infra/hetzner/cloud-init.example.yaml \
#      --start-after-create
#
#  ⚠️  LIMITAÇÕES CONHECIDAS deste cloud-init (ver PHASE-4-hetzner.md):
#    - NÃO cria usuário `deploy` (usa root como user operacional)
#    - NÃO desabilita PasswordAuthentication no sshd (depende do default
#      da imagem Ubuntu 24.04 da Hetzner)
#    - NÃO define timezone (assume UTC, default da cloud image)
#    - NÃO força hostname (o nome `--name demobr-prod-01` é só metadata
#      da Hetzner; o hostname interno continua sendo o da cloud image)
#
#  Estes itens são melhorias sugeridas (NÃO bloqueantes para MVP).
# =============================================================================